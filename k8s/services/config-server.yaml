apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: razorpay-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: vishalkamaliya/razorpay-config-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GIT_USERNAME
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GIT_PASSWORD
            - name: GIT_CONFIG_REPO
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GIT_CONFIG_REPO
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---

apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: razorpay-core
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
