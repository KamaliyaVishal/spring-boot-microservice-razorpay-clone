spring:
  application:
    name: config-server

  cloud:
    config.server.git:
      uri: https://github.com/KamaliyaVishal/distributed-razorpay-clone-config
      username: KamaliyaVishal
      password: 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
      default-label: main

server.port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false

---

#  In a YAML file, the triple dash (---) indicates the start of a new document.
#  Because YAML allows you to bundle multiple distinct documents or configuration sets into a single file,
#  the (---) acts as a clear separation boundary between them.

spring:
  config:
    activate:
      on-profile: k8s

  cloud:
    discovery:
      enabled: false

    config.server.git:
      uri: ${GIT_CONFIG_REPO}
      username: ${GIT_USERNAME}
      password: ${GIT_PASSWORD}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  zipkin:
    tracing:
      endpoint: http://zipkin.razorpay-core.svc.cluster.local:9411/api/v2/spans
